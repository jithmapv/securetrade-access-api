services:
  postgres:
    image: postgres:17-alpine
    container_name: securetrade-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: securetrade_access
      POSTGRES_USER: securetrade
      POSTGRES_PASSWORD: securetrade_dev_password

    ports:
      - "5433:5432"

    volumes:
      - securetrade_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U securetrade -d securetrade_access
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  securetrade_postgres_data:
