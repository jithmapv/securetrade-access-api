# Create trade access requests table
databaseChangeLog:
  - changeSet:
      id: 003-create-access-requests-table
      author: securetrade
      changes:
        - createTable:
            tableName: access_requests
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_access_requests
                    nullable: false
              - column:
                  name: agent_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: symbol
                  type: VARCHAR(12)
                  constraints:
                    nullable: false
              - column:
                  name: trade_type
                  type: VARCHAR(4)
                  constraints:
                    nullable: false
              - column:
                  name: requested_volume
                  type: NUMERIC(15, 2)
                  constraints:
                    nullable: false
              - column:
                  name: risk_score
                  type: NUMERIC(3, 2)
                  constraints:
                    nullable: false
              - column:
                  name: outcome
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: reason_code
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
              - column:
                  name: idempotency_key
                  type: VARCHAR(64)
                  constraints:
                    nullable: true
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: access_requests
            baseColumnNames: agent_id
            referencedTableName: trading_agents
            referencedColumnNames: id
            constraintName: fk_access_requests_agent
        - createIndex:
            tableName: access_requests
            indexName: idx_access_requests_agent_id
            columns:
              - column:
                  name: agent_id
      rollback:
        - dropTable:
            tableName: access_requests
