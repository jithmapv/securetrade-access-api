# Create audit logs table
databaseChangeLog:
  - changeSet:
      id: 005-create-audit-logs-table
      author: securetrade
      changes:
        - createTable:
            tableName: audit_logs
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_audit_logs
                    nullable: false
              - column:
                  name: request_id
                  type: UUID
                  constraints:
                    nullable: true
              - column:
                  name: actor_username
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: action
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: previous_state
                  type: VARCHAR(50)
                  constraints:
                    nullable: true
              - column:
                  name: new_state
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: details
                  type: VARCHAR(255)
                  constraints:
                    nullable: true
              - column:
                  name: timestamp
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: audit_logs
            baseColumnNames: request_id
            referencedTableName: access_requests
            referencedColumnNames: id
            constraintName: fk_audit_logs_request
        - createIndex:
            tableName: audit_logs
            indexName: idx_audit_logs_timestamp
            columns:
              - column:
                  name: timestamp
                  descending: true
      rollback:
        - dropTable:
            tableName: audit_logs
