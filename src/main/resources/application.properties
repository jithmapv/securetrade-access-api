spring.application.name=SecureTradeAccessApi

# Do not save web sessions
server.servlet.session.persistent=false

# PostgreSQL connection
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/securetrade_access}
spring.datasource.username=${DB_USERNAME:securetrade}
spring.datasource.password=${DB_PASSWORD:securetrade_dev_password}

# JPA settings
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Liquibase handles database changes
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

# JWT configuration
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Health endpoints
management.endpoints.web.exposure.include=health,info
